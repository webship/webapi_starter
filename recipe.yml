name: 'WebAPI Starter'
description: 'The basic Drupal API site template: JSON:API served from /api with OAuth 2.0 and Swagger UI documentation, on the standard Drupal content model. UI Suite UIkit is used for the site and UIkit Admin for the back office.'
type: 'Site'
# Site template metadata for the Webships installer.
extra:
  webship_installer:
    creator: 'Webship'
    links:
      - text: 'Learn more'
        url: 'https://www.drupal.org/project/webapi_starter'
recipes:
  # Webpage first: it installs Node, Display Builder and the editorial
  # workflow. The page this template ships is a webpage node rendered
  # through Display Builder.
  - modules/contrib/webpage/recipes/default
  # Tags first: core's standard recipe grants the content editor role
  # permissions on the tags vocabulary, so the vocabulary has to exist.
  - core/recipes/tags_taxonomy
  # The standard Drupal content model: page and article, roles, editor.
  - core/recipes/standard
  # Web API: JSON:API from /api, read-only, with OAuth 2.0 and Swagger UI.
  - modules/contrib/webapi/recipes/default
  # The default dashboards, built with Display Builder: Webmaster for site
  # administrators, Editorial for content editors.
  - webdash
install:
  # The UIkit themes: UI Suite UIkit for the site, UIkit Admin for the back
  # office. UI Suite UIkit needs the UI Suite modules.
  - ui_patterns
  - ui_skins
  - ui_styles
  - ui_icons
  - ui_icons_patterns
  - ui_suite_uikit
  - uikit_admin
config:
  strict: false
  import:
    # The block placements of the themes are optional configuration, which a
    # recipe does not install on its own: without them the pages show no
    # title, no tabs and no status messages.
    ui_suite_uikit:
      - block.block.ui_suite_uikit_account_menu
      - block.block.ui_suite_uikit_breadcrumbs
      - block.block.ui_suite_uikit_content
      - block.block.ui_suite_uikit_footer_menu
      - block.block.ui_suite_uikit_help
      - block.block.ui_suite_uikit_messages
      - block.block.ui_suite_uikit_page_title
      - block.block.ui_suite_uikit_powered
      - block.block.ui_suite_uikit_primary_admin_actions
      - block.block.ui_suite_uikit_primary_local_tasks
      - block.block.ui_suite_uikit_secondary_local_tasks
      - block.block.ui_suite_uikit_site_branding
    uikit_admin:
      - block.block.uikit_admin_branding
      - block.block.uikit_admin_breadcrumbs
      - block.block.uikit_admin_content
      - block.block.uikit_admin_help
      - block.block.uikit_admin_local_actions
      - block.block.uikit_admin_messages
      - block.block.uikit_admin_page_title
      - block.block.uikit_admin_primary_local_tasks
      - block.block.uikit_admin_secondary_local_tasks
  actions:
    # The main menu, in the navbar and in the offcanvas. Created here with an
    # unlimited depth: the theme ships it with a depth of 0, which fails
    # validation when the recipe is applied to an existing site.
    block.block.ui_suite_uikit_main_menu:
      createIfNotExists:
        theme: ui_suite_uikit
        region: navbar_center
        weight: 0
        plugin: 'system_menu_block:main'
        settings:
          id: 'system_menu_block:main'
          label: 'Main navigation'
          label_display: '0'
          provider: system
          level: 1
          depth: null
          expand_all_items: true
        visibility: {  }
    block.block.ui_suite_uikit_main_menu_offcanvas:
      createIfNotExists:
        theme: ui_suite_uikit
        region: offcanvas
        weight: 0
        plugin: 'system_menu_block:main'
        settings:
          id: 'system_menu_block:main'
          label: 'Main navigation'
          label_display: '0'
          provider: system
          level: 1
          depth: null
          expand_all_items: true
        visibility: {  }
    # Content editors write and publish through the editorial workflow.
    user.role.content_editor:
      grantPermissions:
        - 'use editorial transition archive'
        - 'use editorial transition archived_draft'
        - 'use editorial transition archived_published'
        - 'use editorial transition create_new_draft'
        - 'use editorial transition publish'
        - 'view latest version'
      grantPermissionsForEachNodeType:
        - 'create %bundle content'
        - 'delete %bundle revisions'
        - 'delete own %bundle content'
        - 'edit own %bundle content'
    system.theme:
      simpleConfigUpdate:
        default: ui_suite_uikit
        admin: uikit_admin
    node.settings:
      simpleConfigUpdate:
        # Edit and add content in the administration theme.
        use_admin_theme: true
    system.site:
      simpleConfigUpdate:
        slogan: 'A Drupal API, documented and ready to use'
    user.settings:
      simpleConfigUpdate:
        # An API site does not take public registrations.
        register: admin_only
